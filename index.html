<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RizzAI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0A0906;
  --surface: #111009;
  --surface2: #181510;
  --border: rgba(201,169,110,0.12);
  --border-hover: rgba(201,169,110,0.28);
  --gold: #C9A96E;
  --gold-dim: rgba(201,169,110,0.6);
  --gold-glow: rgba(201,169,110,0.08);
  --text: #F5F0E8;
  --text-dim: rgba(245,240,232,0.45);
  --text-muted: rgba(245,240,232,0.25);
  --red: #E05555;
  --green: #6FCF97;
  --radius: 12px;
  --radius-sm: 8px;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 32px 16px 80px;
}

.wrap { width: 100%; max-width: 480px; }

/* ─── HEADER ─── */
.header { text-align: center; margin-bottom: 28px; padding-top: 8px; }
.logo { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: var(--gold); letter-spacing: -0.02em; }
.logo span { color: var(--text-dim); }
.tagline { font-size: 12px; color: var(--text-muted); margin-top: 4px; letter-spacing: 0.04em; }

/* ─── CARD ─── */
.card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
}

/* ─── LABEL ─── */
.lbl {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  display: block;
  margin-bottom: 8px;
}

/* ─── TEXTAREA ─── */
textarea {
  width: 100%;
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 13px;
  color: var(--text);
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  resize: none;
  outline: none;
  min-height: 90px;
  line-height: 1.65;
  transition: border-color 0.2s;
}
textarea:focus { border-color: var(--gold-dim); }
textarea::placeholder { color: var(--text-muted); }

/* ─── SELECTS ROW ─── */
.selects { display: flex; gap: 8px; margin-top: 10px; }
select {
  flex: 1;
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 8px 10px;
  font-size: 12.5px;
  font-family: 'Inter', sans-serif;
  outline: none;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}
select:focus { border-color: var(--gold-dim); }

/* ─── LANG BAR ─── */
.lang-bar { display: flex; gap: 6px; margin-top: 10px; }
.lang-btn {
  flex: 1;
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  font-size: 11.5px;
  font-weight: 500;
  font-family: 'Inter', sans-serif;
  padding: 6px 4px;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}
.lang-btn.active {
  background: var(--gold-glow);
  border-color: var(--gold-dim);
  color: var(--gold);
}

/* ─── GENERATE BUTTON ─── */
.gen-btn {
  width: 100%;
  background: var(--gold);
  border: none;
  color: #0A0906;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  font-family: 'Space Grotesk', sans-serif;
  cursor: pointer;
  margin-top: 12px;
  letter-spacing: 0.01em;
  transition: opacity 0.2s;
}
.gen-btn:hover { opacity: 0.88; }
.gen-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ─── ERROR ─── */
.err { font-size: 12px; color: var(--red); text-align: center; margin-top: 8px; min-height: 16px; }

/* ─── LOADING DOTS ─── */
.dots { display: inline-flex; gap: 4px; align-items: center; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: #0A0906; animation: bounce 1s ease-in-out infinite; }
.dot:nth-child(2) { animation-delay: 0.15s; }
.dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%,100%{opacity:0.3;transform:scale(0.7)} 50%{opacity:1;transform:scale(1)} }

/* ─── EMPTY STATE ─── */
.empty {
  text-align: center;
  padding: 40px 16px;
  color: var(--text-muted);
  font-size: 13px;
  line-height: 2;
}

/* ─── REPLY CARDS ─── */
.reply-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 13px 15px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.12s;
  position: relative;
}
.reply-card:hover { border-color: var(--border-hover); transform: translateX(2px); }
.best-card { border-color: rgba(201,169,110,0.35) !important; background: rgba(201,169,110,0.04); }
.reply-card.copied { border-color: var(--green) !important; }

.reply-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }

.badge {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 20px;
}
.badge-gold { background: rgba(201,169,110,0.15); color: var(--gold); }
.badge-dim { background: rgba(245,240,232,0.06); color: var(--text-muted); }

.copy-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 11px;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  padding: 2px 8px;
  border-radius: 5px;
  transition: color 0.15s;
}
.copy-btn:hover { color: var(--gold); }
.copy-btn.done { color: var(--green); }

.reply-text {
  font-size: 15px;
  line-height: 1.55;
  color: var(--text);
}

/* ─── MORE BUTTON ─── */
.more-btn {
  width: 100%;
  background: transparent;
  border: 0.5px solid var(--border);
  border-radius: 10px;
  color: var(--text-dim);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  padding: 10px;
  cursor: pointer;
  margin-top: 4px;
  transition: border-color 0.15s, color 0.15s;
}
.more-btn:hover { border-color: var(--border-hover); color: var(--gold); }

/* ─── DETECT BADGE ─── */
.lang-detect {
  font-size: 10px;
  color: var(--gold-dim);
  text-align: center;
  margin-top: 5px;
  min-height: 14px;
}

@media (max-width: 400px) {
  .selects { flex-direction: column; }
}
</style>
</head>

<body>
<div class="wrap">

  <div class="header">
    <div class="logo">Rizz<span>AI</span></div>
    <div class="tagline">paste the message · get the reply · send it</div>
  </div>

  <div class="card">
    <span class="lbl">Their message or situation</span>
    <textarea id="msgInput" rows="4"
      placeholder="e.g. ek ladki ka hey aya hai, kya reply du&#10;e.g. she said haha okay, baat dry ho rahi hai&#10;e.g. usse puchna hai kya kar rhi hai lately"></textarea>

    <div class="selects">
      <select id="tone">
        <option value="chill">😌 Chill</option>
        <option value="flirty">✨ Flirty</option>
        <option value="funny">😭 Funny</option>
        <option value="cute">🤍 Cute</option>
        <option value="savage">🫠 Savage</option>
      </select>
      <select id="ctx">
        <option value="unknown">Unknown person</option>
        <option value="crush">Crush</option>
        <option value="friend">Friend</option>
        <option value="early">Just started talking</option>
        <option value="ongoing">Been talking a while</option>
        <option value="gap">Gap restart</option>
        <option value="dry">Dry conversation</option>
        <option value="hinge">Hinge / Dating app</option>
      </select>
    </div>

    <div class="lang-bar">
      <button class="lang-btn active" data-lang="auto" onclick="setLang('auto',this)">Auto</button>
      <button class="lang-btn" data-lang="hinglish" onclick="setLang('hinglish',this)">Hinglish</button>
      <button class="lang-btn" data-lang="english" onclick="setLang('english',this)">English</button>
    </div>
    <div class="lang-detect" id="langDetect"></div>

    <button class="gen-btn" id="genBtn" onclick="generate(false)">⚡ Generate</button>
    <div class="err" id="err"></div>
  </div>

  <div id="results">
    <div class="empty">— type above, hit generate —<br>3 replies aayenge<br>click any to copy</div>
  </div>

</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let selectedLang = 'auto';
let currentReplies = [];

const TONES = {
  chill: "chill, low effort, unbothered",
  flirty: "subtle flirty, light tension, playful but not desperate",
  funny: "actually funny and witty",
  cute: "warm, genuine, slightly playful",
  savage: "confident, slightly teasing, zero neediness"
};

const CTXS = {
  unknown: "complete stranger, first contact, do NOT assume chemistry",
  crush: "crush, some familiarity exists",
  friend: "friend, casual and comfortable",
  early: "just started talking 1-2 times",
  ongoing: "been talking for a while",
  gap: "reconnecting after a gap, acknowledge lightly",
  dry: "conversation going dry, rescue mode",
  hinge: "hinge or dating app, react to their prompt naturally"
};

// ─── LANGUAGE ─────────────────────────────────────────────────────────────────
function setLang(lang, el) {
  selectedLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('langDetect').textContent = '';
}

function detectLang(input) {
  const lower = input.toLowerCase();

  // Explicit user request
  if (/english\s*(m[eê]n|mai|mein|me|do|chahiye|dena)/i.test(lower) ||
      /in english|english mein/i.test(lower)) return 'english';
  if (/(hinglish\s*(m[eê]n|mai|mein|me|do|chahiye))/i.test(lower)) return 'hinglish';

  // Auto-detect from content
  const hindiWords = (lower.match(/\b(yaar|bhai|kya|toh|hai|nahi|tha|thi|woh|mein|hoon|baat|bolo|karo|dekho|suno|chalo|phir|abhi|bas|ladki|ladka|dost|accha|theek|bilkul|matlab|kal|aaj|usse|uska|usne|puchna|puch|bata|aya|gyi|krna|krdo|rehti|rehta|busy|chal|rha|rhi)\b/gi) || []).length;

  if (hindiWords >= 2) return 'hinglish';
  return 'english';
}

function buildLangInstruction(lang) {
  if (lang === 'hinglish') {
    return 'LANGUAGE: Hinglish — natural mix of Hindi+English exactly like Indian Gen Z texts. Not forced. Not full Hindi. Not formal.';
  }
  return 'LANGUAGE: Casual Gen Z English only. Lowercase. Natural. Like iMessage or Instagram DM.';
}

// ─── GENERATE ────────────────────────────────────────────────────────────────
async function generate(isMore = false) {
  const msg = document.getElementById('msgInput').value.trim();
  if (!msg) { showErr('Kuch toh type karo'); return; }

  showErr('');
  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';

  if (!isMore) {
    currentReplies = [];
    document.getElementById('results').innerHTML = '';
  }

  const tone = document.getElementById('tone').value;
  const ctx = document.getElementById('ctx').value;

  // Language detection
  let lang = selectedLang;
  if (lang === 'auto') {
    lang = detectLang(msg);
    document.getElementById('langDetect').textContent = `Detected: ${lang === 'hinglish' ? 'Hinglish' : 'English'}`;
  }

  const langInstruction = buildLangInstruction(lang);

  // Build full message with language instruction prepended
  const fullMsg = `${langInstruction}\n${msg}`;

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        msg: fullMsg,
        tone: TONES[tone],
        ctx: CTXS[ctx],
        previousReplies: isMore ? currentReplies : []
      })
    });

    const data = await res.json();

    if (!res.ok) throw new Error(data?.error || 'Error aaya');
    if (!data.replies?.length) throw new Error('Retry karo');

    currentReplies = [...currentReplies, ...data.replies];
    renderReplies(data.replies, data.best || data.replies[0], isMore);

  } catch (e) {
    showErr(e.message || 'Error — retry karo');
  }

  btn.disabled = false;
  btn.innerHTML = '⚡ Generate';
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderReplies(replies, best, append = false) {
  const container = document.getElementById('results');

  if (!append) {
    container.innerHTML = '';
  } else {
    const existing = container.querySelector('.more-btn');
    if (existing) existing.remove();
  }

  replies.forEach((text, i) => {
    const isBest = !append && text === best && i === 0;
    const card = document.createElement('div');
    card.className = 'reply-card' + (isBest ? ' best-card' : '');
    
    let badgeText, badgeClass;
    if (isBest) {
      badgeText = '✦ Best';
      badgeClass = 'badge-gold';
    } else {
      badgeText = 'Option ' + (append ? currentReplies.indexOf(text) + 1 : i + 1);
      badgeClass = 'badge-dim';
    }

    card.innerHTML = `
      <div class="reply-header">
        <span class="badge ${badgeClass}">${badgeText}</span>
        <button class="copy-btn" onclick="event.stopPropagation(); copyText(this, ${JSON.stringify(text)})">Copy</button>
      </div>
      <div class="reply-text">${escHtml(text)}</div>
    `;
    card.addEventListener('click', () => copyText(card.querySelector('.copy-btn'), text));
    container.appendChild(card);
  });

  const moreBtn = document.createElement('button');
  moreBtn.className = 'more-btn';
  moreBtn.textContent = 'or do — show different ones';
  moreBtn.onclick = () => generate(true);
  container.appendChild(moreBtn);
}

// ─── COPY ─────────────────────────────────────────────────────────────────────
function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    const card = btn.closest('.reply-card');
    btn.textContent = '✓ Copied';
    btn.classList.add('done');
    if (card) {
      card.classList.add('copied');
      setTimeout(() => {
        card.classList.remove('copied');
        btn.textContent = 'Copy';
        btn.classList.remove('done');
      }, 1500);
    }
  });
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function showErr(msg) { document.getElementById('err').textContent = msg; }
function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Ctrl+Enter to generate
document.getElementById('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) generate(false);
});
</script>
</body>
</html>
