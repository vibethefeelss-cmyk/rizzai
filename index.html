<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0A14">
<title>RizzAI — Better Replies</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0A0A14;
  --card:#12121F;
  --input:#1A1A2E;
  --border:#2A2A45;
  --text:#F0EFFF;
  --muted:#8888AA;
  --dim:#44445A;
  --purple:#7C3AED;
  --purple2:#9D5EFF;
  --green:#10B981;
  --red:#EF4444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  min-height:100%;
}

body{
  font-family:"Inter",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:24px 16px 60px;
}

.wrap{
  width:100%;
  max-width:520px;
  margin:0 auto;
}

.header{
  text-align:center;
  margin-bottom:24px;
  padding-top:8px;
}

.logo-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:7px;
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  background:linear-gradient(135deg,#7C3AED,#F472B6);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  box-shadow:0 8px 30px rgba(124,58,237,.22);
}

.logo-text{
  font-size:23px;
  font-weight:700;
  letter-spacing:-.5px;
  background:linear-gradient(90deg,#fff 25%,#9D5EFF);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.tagline{
  color:var(--muted);
  font-size:13px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}

.lbl{
  display:block;
  font-size:10px;
  font-weight:700;
  color:var(--dim);
  letter-spacing:.09em;
  text-transform:uppercase;
  margin-bottom:9px;
}

textarea{
  width:100%;
  min-height:115px;
  resize:vertical;
  border-radius:11px;
  border:1px solid var(--border);
  background:var(--input);
  color:var(--text);
  padding:13px;
  font-family:inherit;
  font-size:14px;
  line-height:1.6;
  outline:none;
  transition:.2s ease;
}

textarea:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 3px rgba(124,58,237,.10);
}

textarea::placeholder{
  color:var(--dim);
}

.row{
  display:flex;
  gap:9px;
  margin-top:11px;
  flex-wrap:wrap;
}

select{
  flex:1;
  min-width:140px;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 11px;
  font-family:inherit;
  font-size:13px;
  outline:none;
  cursor:pointer;
}

select:focus{
  border-color:var(--purple);
}

.btn{
  width:100%;
  margin-top:12px;
  padding:13px;
  border:0;
  border-radius:11px;
  background:var(--purple);
  color:#fff;
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:.2s ease;
  min-height:48px;
}

.btn:hover{
  background:#6D28D9;
  transform:translateY(-1px);
}

.btn:active{
  transform:translateY(0);
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

.err{
  display:none;
  color:#FCA5A5;
  background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.2);
  border-radius:9px;
  padding:10px 12px;
  margin-top:10px;
  font-size:12px;
  line-height:1.5;
  text-align:center;
}

.reply{
  position:relative;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 15px;
  margin-bottom:10px;
  cursor:pointer;
  transition:.2s ease;
  -webkit-tap-highlight-color:transparent;
}

.reply:hover{
  border-color:#55428C;
  transform:translateX(2px);
}

.reply.best{
  border-color:rgba(124,58,237,.65);
  background:linear-gradient(
    135deg,
    rgba(124,58,237,.10),
    rgba(18,18,31,1)
  );
}

.reply-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
}

.badge{
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  padding:3px 9px;
  border-radius:20px;
}

.badge.best-badge{
  color:#BDA5FF;
  background:rgba(124,58,237,.18);
}

.badge.alt-badge{
  color:var(--muted);
  background:rgba(255,255,255,.05);
}

.cpbtn{
  border:0;
  background:transparent;
  color:var(--muted);
  font-family:inherit;
  font-size:12px;
  cursor:pointer;
  padding:4px 7px;
  border-radius:6px;
}

.cpbtn:hover{
  background:rgba(255,255,255,.05);
  color:#fff;
}

.reply-text{
  font-size:15px;
  font-weight:500;
  line-height:1.55;
  color:var(--text);
  word-break:break-word;
}

.empty{
  text-align:center;
  padding:40px 16px;
  color:var(--dim);
  font-size:13px;
  line-height:1.8;
}

.loading{
  text-align:center;
  padding:35px 16px;
  color:var(--muted);
  font-size:13px;
}

.dots{
  display:inline-flex;
  align-items:center;
  gap:5px;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  animation:pulse 1.1s ease-in-out infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes pulse{
  0%,100%{
    opacity:.25;
    transform:scale(.7);
  }

  50%{
    opacity:1;
    transform:scale(1);
  }
}

@media(max-width:420px){

  body{
    padding:18px 12px 45px;
  }

  .card{
    padding:14px;
  }

  .row{
    flex-direction:column;
  }

  select{
    width:100%;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">

    <div class="logo-row">
      <div class="logo-icon">💬</div>
      <div class="logo-text">RizzAI</div>
    </div>

    <div class="tagline">
      paste the message. get the reply. send it.
    </div>

  </div>


  <div class="card">

    <label class="lbl" for="msgInput">
      Their message / situation
    </label>

    <textarea
      id="msgInput"
      placeholder='paste their message or describe the situation...

e.g. "unknown ladki ka hey aya hai"
e.g. "she said haha okay, baat dry ho rahi hai"
e.g. "hinge prompt: key to my heart is maggie and tea"'
    ></textarea>


    <div class="row">

      <select id="tone">

        <option value="chill">😌 Chill</option>
        <option value="flirty">✨ Flirty</option>
        <option value="funny">😭 Funny</option>
        <option value="cute">🤍 Cute</option>
        <option value="savage">🫠 Savage</option>

      </select>


      <select id="ctx">

        <option value="unknown">Unknown person</option>
        <option value="crush">Crush</option>
        <option value="friend">Friend</option>
        <option value="early">Just started talking</option>
        <option value="ongoing">Been talking a while</option>
        <option value="gap">Gap restart</option>
        <option value="dry">Dry conversation</option>
        <option value="hinge">Hinge / Dating app</option>

      </select>

    </div>


    <button
      class="btn"
      id="genBtn"
      type="button"
    >
      ⚡ Generate
    </button>


    <div
      class="err"
      id="err"
      role="alert"
    ></div>

  </div>


  <div id="results">

    <div class="empty">
      💬
      <br><br>
      paste their message above
      <br>
      hit generate — 3 options aayenge
      <br>
      click any to copy
    </div>

  </div>

</div>


<script>

const TONES = {

  chill:
    "chill, low effort, relaxed, effortless, natural",

  flirty:
    "subtle flirty, playful, light tension, confident, never desperate",

  funny:
    "actually witty or amusing when appropriate, natural, not try-hard",

  cute:
    "warm, genuine, charming, lightly playful, not childish",

  savage:
    "confident, slightly teasing, sharp but not rude or cruel"

};


const CTXS = {

  unknown:
    "complete stranger or new contact, first contact, do not assume attraction or chemistry",

  crush:
    "crush, some familiarity may exist, keep flirting calibrated",

  friend:
    "friend, casual and comfortable conversation",

  early:
    "new conversation, only talked a little, low to moderate familiarity",

  ongoing:
    "already talking for some time, use context naturally",

  gap:
    "reconnecting after a gap, acknowledge naturally without sounding needy",

  dry:
    "conversation is losing momentum or getting dry, create a natural new hook",

  hinge:
    "dating app context, use the specific profile or prompt detail naturally"

};


const msgInput = document.getElementById("msgInput");
const toneSelect = document.getElementById("tone");
const ctxSelect = document.getElementById("ctx");
const generateButton = document.getElementById("genBtn");
const results = document.getElementById("results");
const errorBox = document.getElementById("err");


generateButton.addEventListener("click", generate);


msgInput.addEventListener("keydown", function(event){

  if(
    (event.ctrlKey || event.metaKey) &&
    event.key === "Enter"
  ){
    generate();
  }

});


async function generate(){

  const msg = msgInput.value.trim();


  if(!msg){

    showError(
      "kuch message ya situation type karo"
    );

    msgInput.focus();

    return;

  }


  clearError();

  setLoading(true);


  try{

    const response = await fetch("/api/generate", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        msg: msg,

        tone: TONES[toneSelect.value],

        ctx: CTXS[ctxSelect.value]

      })

    });


    let data;


    try{

      data = await response.json();

    }catch(parseError){

      throw new Error(
        "server ne valid response nahi diya. backend deployment check karo."
      );

    }


    if(!response.ok){

      throw new Error(
        data?.error ||
        `server error (${response.status})`
      );

    }


    if(
      !data ||
      !Array.isArray(data.replies)
    ){

      throw new Error(
        "server response format invalid hai"
      );

    }


    const cleanedReplies = data.replies
      .map(cleanReply)
      .filter(Boolean)
      .slice(0, 3);


    if(cleanedReplies.length === 0){

      throw new Error(
        "replies generate nahi hui. ek baar retry karo."
      );

    }


    renderReplies(cleanedReplies);


  }catch(error){

    console.error("Generate error:", error);


    const message =
      error?.message ||
      "kuch galat hua. retry karo.";


    if(
      error instanceof TypeError &&
      /fetch/i.test(message)
    ){

      showError(
        "server se connection nahi ho pa raha. deployment aur /api/generate check karo."
      );

    }else{

      showError(message);

    }


    results.innerHTML = `
      <div class="empty">
        💬
        <br><br>
        reply generate nahi hua
        <br>
        neeche wala error check karo
      </div>
    `;

  }finally{

    setLoading(false);

  }

}


function cleanReply(text){

  if(typeof text !== "string"){
    return "";
  }


  return text

    .trim()

    .replace(
      /^(option\s*\d+\s*[:.\-]?\s*|\d+\s*[.)\-:]\s*)/i,
      ""
    )

    .replace(/^["'`]+|["'`]+$/g,"")

    .trim();

}


function renderReplies(replies){

  const labels = [
    "✦ Best",
    "Alt 1",
    "Alt 2"
  ];


  results.innerHTML = "";


  replies.forEach(function(text,index){

    const card = document.createElement("div");

    card.className =
      "reply" +
      (index === 0 ? " best" : "");


    const top = document.createElement("div");

    top.className = "reply-top";


    const badge = document.createElement("span");

    badge.className =
      "badge " +
      (index === 0
        ? "best-badge"
        : "alt-badge"
      );

    badge.textContent =
      labels[index] ||
      `Alt ${index}`;


    const copyButton =
      document.createElement("button");

    copyButton.className = "cpbtn";

    copyButton.type = "button";

    copyButton.textContent = "Copy";


    const replyText =
      document.createElement("div");

    replyText.className = "reply-text";

    replyText.textContent = text;


    top.appendChild(badge);

    top.appendChild(copyButton);


    card.appendChild(top);

    card.appendChild(replyText);


    card.addEventListener(
      "click",
      function(){

        copyReply(text, card);

      }
    );


    copyButton.addEventListener(
      "click",
      function(event){

        event.stopPropagation();

        copyReply(text, card);

      }
    );


    results.appendChild(card);

  });

}


async function copyReply(text,card){

  try{

    if(
      navigator.clipboard &&
      window.isSecureContext
    ){

      await navigator.clipboard.writeText(text);

    }else{

      fallbackCopy(text);

    }


    const button =
      card.querySelector(".cpbtn");


    if(button){

      const oldText =
        button.textContent;

      button.textContent =
        "✓ Copied";


      setTimeout(function(){

        button.textContent =
          oldText;

      },1400);

    }


    const oldBorder =
      card.style.borderColor;


    card.style.borderColor =
      "#10B981";


    setTimeout(function(){

      card.style.borderColor =
        oldBorder;

    },1400);


  }catch(error){

    console.error(
      "Copy failed:",
      error
    );

  }

}


function fallbackCopy(text){

  const textarea =
    document.createElement("textarea");


  textarea.value = text;


  textarea.style.position = "fixed";

  textarea.style.opacity = "0";


  document.body.appendChild(textarea);


  textarea.focus();

  textarea.select();


  document.execCommand("copy");


  document.body.removeChild(textarea);

}


function setLoading(isLoading){

  generateButton.disabled =
    isLoading;


  if(isLoading){

    generateButton.innerHTML = `
      <span class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </span>
    `;


    results.innerHTML = `
      <div class="loading">
        thinking of something actually worth sending...
      </div>
    `;

  }else{

    generateButton.textContent =
      "⚡ Generate";

  }

}


function showError(message){

  errorBox.textContent =
    message;


  errorBox.style.display =
    "block";

}


function clearError(){

  errorBox.textContent =
    "";


  errorBox.style.display =
    "none";

}

</script>

</body>
</html>
