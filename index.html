<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08080d" />

  <title>RizzAI — Text Better</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #08080d;
      --card: #111118;
      --card-2: #15151e;
      --border: #292936;
      --text: #f7f7fb;
      --muted: #90909e;
      --purple: #8b5cf6;
      --purple-2: #6d42e8;
      --danger: #ff6b81;
      --success: #4ade80;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(139, 92, 246, 0.18),
          transparent 38%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    textarea,
    select {
      font: inherit;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 28px 16px 60px;
    }

    /* HEADER */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--purple-2)
        );
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 10px 35px rgba(139, 92, 246, 0.25);
    }

    .brand-text h1 {
      font-size: 20px;
      line-height: 1;
      letter-spacing: -0.4px;
    }

    .brand-text p {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .connection-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #777;
    }

    .connection-dot.ready {
      background: var(--success);
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
    }

    .connection-dot.error {
      background: var(--danger);
    }

    /* CARD */

    .card {
      background:
        linear-gradient(
          180deg,
          rgba(20, 20, 28, 0.98),
          rgba(13, 13, 19, 0.98)
        );
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.35);
    }

    .input-label {
      display: block;
      margin-bottom: 9px;
      color: #c9c9d3;
      font-size: 13px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 190px;
      resize: vertical;

      padding: 16px;

      border: 1px solid var(--border);
      border-radius: 16px;

      background: #0a0a0f;
      color: var(--text);

      outline: none;
      line-height: 1.55;
      font-size: 14px;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    textarea::placeholder {
      color: #656571;
    }

    textarea:focus {
      border-color: rgba(139, 92, 246, 0.8);
      box-shadow:
        0 0 0 3px rgba(139, 92, 246, 0.08);
    }

    /* CONTROLS */

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 12px;
    }

    select {
      width: 100%;
      height: 50px;

      padding: 0 14px;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: #0a0a0f;
      color: var(--text);

      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: rgba(139, 92, 246, 0.8);
    }

    .generate-btn {
      height: 50px;
      padding: 0 22px;

      border: none;
      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--purple-2)
        );

      color: white;
      font-size: 14px;
      font-weight: 750;

      cursor: pointer;

      box-shadow:
        0 10px 30px rgba(109, 66, 232, 0.22);

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .generate-btn:hover {
      transform: translateY(-1px);
    }

    .generate-btn:active {
      transform: translateY(0);
    }

    .generate-btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    /* ERROR */

    .error {
      min-height: 18px;
      margin: 10px 2px 0;

      color: var(--danger);
      font-size: 12px;
      line-height: 1.4;
    }

    /* RESULTS */

    .results {
      margin-top: 14px;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 10px;
    }

    .results-title {
      font-size: 15px;
      font-weight: 700;
    }

    .results-count {
      color: var(--muted);
      font-size: 11px;
    }

    .empty {
      padding: 42px 15px;

      border: 1px dashed var(--border);
      border-radius: 16px;

      color: #70707d;
      text-align: center;
      font-size: 13px;
    }

    .reply {
      position: relative;

      margin-top: 9px;
      padding: 17px 62px 17px 17px;

      min-height: 58px;

      background: #0a0a0f;

      border: 1px solid var(--border);
      border-radius: 16px;

      color: #f3f3f7;

      font-size: 14px;
      line-height: 1.5;

      transition:
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .reply:hover {
      border-color: #383847;
      background: #0d0d13;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;

      height: 30px;
      padding: 0 10px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: #171720;
      color: #bdbdc8;

      font-size: 11px;
      cursor: pointer;
    }

    .copy-btn:hover {
      color: white;
      background: #1d1d28;
    }

    .footer-note {
      margin-top: 13px;

      color: #666673;
      text-align: center;

      font-size: 10px;
      line-height: 1.5;
    }

    /* LOADING */

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      padding: 42px 15px;

      border: 1px dashed var(--border);
      border-radius: 16px;

      color: var(--muted);
      font-size: 13px;
    }

    .loader {
      width: 14px;
      height: 14px;

      border: 2px solid #343440;
      border-top-color: var(--purple);

      border-radius: 50%;

      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .app {
        padding: 18px 10px 40px;
      }

      .header {
        margin-bottom: 16px;
      }

      .card {
        padding: 13px;
        border-radius: 18px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .generate-btn {
        width: 100%;
      }

      textarea {
        min-height: 175px;
      }

      .connection {
        display: none;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">

      <div class="brand">

        <div class="logo">✦</div>

        <div class="brand-text">
          <h1>RizzAI</h1>
          <p>say less. text better.</p>
        </div>

      </div>

      <div class="connection">
        <span
          id="connectionDot"
          class="connection-dot"
        ></span>

        <span id="connectionText">
          checking...
        </span>
      </div>

    </header>


    <section class="card">

      <label
        class="input-label"
        for="chatInput"
      >
        Chat / incoming message
      </label>

      <textarea
        id="chatInput"
        placeholder="paste the chat here...

example:
her: kal exam hai aur maine kuch nahi padha

or:
ek unknown ladki ka hey aya hai, baat start karni hai"
      ></textarea>


      <div class="controls">

        <select id="tone">

          <option value="Dry → Playful">
            Dry → Playful
          </option>

          <option value="Teasing → Roast">
            Teasing → Roast
          </option>

          <option value="Smooth → Direct">
            Smooth → Direct
          </option>

          <option value="Chill → Effortless">
            Chill → Effortless
          </option>

          <option value="Subtle Flirty">
            Subtle Flirty
          </option>

        </select>


        <button
          id="generateBtn"
          class="generate-btn"
          type="button"
        >
          Generate Reply
        </button>

      </div>


      <div
        id="error"
        class="error"
        aria-live="polite"
      ></div>

    </section>


    <section class="card results">

      <div class="results-header">

        <div class="results-title">
          Replies
        </div>

        <div class="results-count">
          3 copy-ready options
        </div>

      </div>


      <div id="results">

        <div class="empty">
          Your replies will appear here.
        </div>

      </div>

    </section>


    <div class="footer-note">
      RizzAI · Your API key is never stored in this frontend.
    </div>

  </main>


  <script>
    "use strict";

    /*
      ==========================================================
      RIZZAI FRONTEND
      ==========================================================

      IMPORTANT:

      THERE IS NO GROQ API KEY IN THIS FILE.

      The browser sends requests ONLY to your backend.

      Frontend:
          index.html
               ↓
      Your Vercel Backend:
          /api/generate
               ↓
      Groq API

      The backend will hold the secret GROQ_API_KEY
      inside Vercel Environment Variables.
    */


    /*
      ==========================================================
      BACKEND URL
      ==========================================================

      LOCAL DEVELOPMENT:

      If your backend runs locally:

          http://localhost:3000/api/generate

      PRODUCTION:

      After deploying to Vercel, change this to:

          /api/generate

      Using a relative URL is recommended when frontend
      and backend are deployed under the same Vercel project.
    */

    const BACKEND_ENDPOINT = "/api/generate";


    const chatInput =
      document.getElementById("chatInput");

    const tone =
      document.getElementById("tone");

    const generateBtn =
      document.getElementById("generateBtn");

    const results =
      document.getElementById("results");

    const errorBox =
      document.getElementById("error");

    const connectionDot =
      document.getElementById("connectionDot");

    const connectionText =
      document.getElementById("connectionText");


    /*
      ==========================================================
      CONNECTION STATUS
      ==========================================================
    */

    function setConnection(status, text) {

      connectionDot.className =
        "connection-dot";

      if (status === "ready") {
        connectionDot.classList.add("ready");
      }

      if (status === "error") {
        connectionDot.classList.add("error");
      }

      connectionText.textContent = text;
    }


    /*
      ==========================================================
      ESCAPE HTML
      ==========================================================

      Prevents generated text from being interpreted as HTML.
    */

    function escapeHTML(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /*
      ==========================================================
      SHOW ERROR
      ==========================================================
    */

    function showError(message) {

      errorBox.textContent = message;
    }


    function clearError() {

      errorBox.textContent = "";
    }


    /*
      ==========================================================
      LOADING UI
      ==========================================================
    */

    function showLoading() {

      results.innerHTML = `
        <div class="loading">
          <span class="loader"></span>
          <span>thinking...</span>
        </div>
      `;
    }


    /*
      ==========================================================
      SHOW REPLIES
      ==========================================================
    */

    function renderReplies(replies) {

      results.innerHTML = "";

      replies.forEach(function(reply) {

        const replyElement =
          document.createElement("div");

        replyElement.className = "reply";

        replyElement.innerHTML = `
          <span>${escapeHTML(reply)}</span>
        `;


        const copyButton =
          document.createElement("button");

        copyButton.className = "copy-btn";

        copyButton.type = "button";

        copyButton.textContent = "copy";


        copyButton.addEventListener(
          "click",
          async function() {

            try {

              await navigator.clipboard.writeText(
                reply
              );

              copyButton.textContent =
                "copied";

              setTimeout(function() {

                copyButton.textContent =
                  "copy";

              }, 900);

            } catch {

              copyButton.textContent =
                "failed";

            }

          }
        );


        replyElement.appendChild(
          copyButton
        );

        results.appendChild(
          replyElement
        );

      });

    }


    /*
      ==========================================================
      VALIDATE BACKEND RESPONSE
      ==========================================================
    */

    function validateReplies(data) {

      if (!data || typeof data !== "object") {
        throw new Error(
          "Invalid response from backend."
        );
      }


      if (!Array.isArray(data.replies)) {
        throw new Error(
          "Backend returned an invalid reply format."
        );
      }


      if (data.replies.length !== 3) {
        throw new Error(
          "Backend must return exactly 3 replies."
        );
      }


      const replies =
        data.replies.map(function(reply) {

          if (
            typeof reply !== "string" ||
            !reply.trim()
          ) {
            throw new Error(
              "Backend returned an invalid reply."
            );
          }

          return reply.trim();

        });


      return replies;
    }


    /*
      ==========================================================
      GENERATE REPLY
      ==========================================================

      IMPORTANT:

      This function NEVER talks directly to Groq.

      It talks only to:

          /api/generate

      Your Vercel backend is responsible for:

          - Groq API key
          - model selection
          - fallback models
          - system prompt
          - Groq API request
          - response validation
    */

    async function generateReply() {

      clearError();


      const message =
        chatInput.value.trim();


      const selectedTone =
        tone.value;


      if (!message) {

        showError(
          "paste the chat first."
        );

        chatInput.focus();

        return;
      }


      generateBtn.disabled = true;

      generateBtn.textContent =
        "Generating…";


      showLoading();

      setConnection(
        "ready",
        "connecting..."
      );


      try {

        const controller =
          new AbortController();


        const timeout =
          setTimeout(function() {

            controller.abort();

          }, 45000);


        let response;


        try {

          response =
            await fetch(
              BACKEND_ENDPOINT,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  message: message,

                  tone: selectedTone

                }),

                signal: controller.signal

              }
            );

        } finally {

          clearTimeout(timeout);

        }


        let data = null;


        try {

          data =
            await response.json();

        } catch {

          throw new Error(
            "Backend returned an invalid response."
          );

        }


        if (!response.ok) {

          throw new Error(
            data?.error ||
            "Backend request failed."
          );

        }


        const replies =
          validateReplies(data);


        renderReplies(replies);


        setConnection(
          "ready",
          "ready"
        );

      } catch (error) {

        console.error(
          "RizzAI error:",
          error
        );


        results.innerHTML = `
          <div class="empty">
            Couldn't generate a reply.
          </div>
        `;


        if (
          error.name ===
          "AbortError"
        ) {

          showError(
            "request timed out. try again."
          );

        } else {

          showError(
            error.message ||
            "something went wrong. try again."
          );

        }


        setConnection(
          "error",
          "connection error"
        );

      } finally {

        generateBtn.disabled =
          false;

        generateBtn.textContent =
          "Generate Reply";

      }

    }


    /*
      ==========================================================
      BUTTON
      ==========================================================
    */

    generateBtn.addEventListener(
      "click",
      generateReply
    );


    /*
      ==========================================================
      CTRL + ENTER
      ==========================================================
    */

    chatInput.addEventListener(
      "keydown",
      function(event) {

        if (
          (event.ctrlKey ||
           event.metaKey) &&
          event.key === "Enter"
        ) {

          event.preventDefault();

          generateReply();

        }

      }
    );


    /*
      ==========================================================
      INITIAL STATE
      ==========================================================
    */

    setConnection(
      "ready",
      "backend ready"
    );

  </script>

</body>
</html>
