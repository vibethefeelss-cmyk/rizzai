<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a14">
<meta name="description" content="RizzAI — natural replies for real conversations">
<title>RizzAI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#090910;
  --card:#11111b;
  --input:#181824;
  --border:#29293d;
  --border-hover:#454565;
  --text:#f3f1ff;
  --muted:#85859d;
  --dim:#505067;
  --purple:#7c3aed;
  --purple-light:#9d5cff;
  --danger:#ef4444;
  --success:#10b981;
}

body{
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(circle at 50% -10%,rgba(124,58,237,.13),transparent 35%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:24px 16px 70px;
  -webkit-font-smoothing:antialiased;
}

button,
textarea,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.wrap{
  width:100%;
  max-width:540px;
  margin:0 auto;
}

/* HEADER */

.header{
  text-align:center;
  padding:12px 0 25px;
}

.logo-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:7px;
}

.logo-icon{
  width:36px;
  height:36px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7c3aed,#ec4899);
  box-shadow:0 8px 30px rgba(124,58,237,.22);
  font-size:17px;
}

.logo-text{
  font-size:22px;
  font-weight:700;
  letter-spacing:-.03em;
  background:linear-gradient(90deg,#fff,#b78aff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.tagline{
  color:var(--muted);
  font-size:12px;
  letter-spacing:.01em;
}

/* MAIN CARD */

.card{
  background:rgba(17,17,27,.94);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 15px 50px rgba(0,0,0,.18);
}

.lbl{
  display:block;
  margin-bottom:9px;
  color:#66667d;
  font-size:10px;
  font-weight:700;
  letter-spacing:.09em;
  text-transform:uppercase;
}

textarea{
  display:block;
  width:100%;
  min-height:118px;
  resize:vertical;
  background:var(--input);
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  color:var(--text);
  padding:13px 14px;
  font-size:14px;
  line-height:1.6;
  transition:.2s ease;
}

textarea:focus{
  border-color:rgba(124,58,237,.8);
  box-shadow:0 0 0 3px rgba(124,58,237,.08);
}

textarea::placeholder{
  color:#4b4b62;
}

/* CONTROLS */

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:10px;
}

.control{
  min-width:0;
}

select{
  width:100%;
  background:var(--input);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 11px;
  border-radius:10px;
  outline:none;
  font-size:12px;
  cursor:pointer;
}

select:focus{
  border-color:var(--purple);
}

.generate{
  width:100%;
  min-height:46px;
  margin-top:11px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#7c3aed,#6d28d9);
  color:#fff;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 8px 25px rgba(124,58,237,.18);
  transition:transform .15s ease,filter .15s ease,opacity .15s ease;
}

.generate:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
}

.generate:active{
  transform:translateY(0);
}

.generate:disabled{
  opacity:.58;
  cursor:not-allowed;
  transform:none;
}

/* STATUS */

.status{
  min-height:18px;
  margin-top:8px;
  text-align:center;
  color:var(--danger);
  font-size:12px;
  line-height:1.4;
}

/* RESULTS */

.results-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:4px 2px 9px;
}

.results-title{
  color:#73738c;
  font-size:10px;
  font-weight:700;
  letter-spacing:.09em;
  text-transform:uppercase;
}

.results-hint{
  color:#4e4e64;
  font-size:10px;
}

.reply{
  position:relative;
  background:rgba(17,17,27,.94);
  border:1px solid var(--border);
  border-radius:13px;
  padding:14px 15px;
  margin-bottom:9px;
  transition:border-color .18s ease,transform .18s ease,background .18s ease;
}

.reply:hover{
  border-color:var(--border-hover);
  transform:translateY(-1px);
}

.reply.best{
  border-color:rgba(124,58,237,.48);
  background:
    linear-gradient(120deg,rgba(124,58,237,.08),rgba(17,17,27,.96));
}

.reply-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
}

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:20px;
  padding:3px 8px;
  font-size:9px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}

.badge.best{
  color:#b58cff;
  background:rgba(124,58,237,.16);
}

.badge.alt{
  color:#74748c;
  background:rgba(255,255,255,.045);
}

.copy{
  border:0;
  background:transparent;
  color:#77778e;
  cursor:pointer;
  padding:3px 0 3px 10px;
  font-size:11px;
}

.copy:hover{
  color:#b0aec5;
}

.reply-text{
  color:#f0eef9;
  font-size:15px;
  line-height:1.55;
  font-weight:500;
  word-break:break-word;
}

/* EMPTY */

.empty{
  border:1px dashed #242438;
  border-radius:14px;
  padding:38px 18px;
  text-align:center;
  color:#4b4b62;
  font-size:12px;
  line-height:1.8;
}

.empty-icon{
  font-size:22px;
  opacity:.65;
  margin-bottom:7px;
}

/* LOADING */

.loading{
  border:1px solid var(--border);
  border-radius:13px;
  padding:20px;
  text-align:center;
  color:#66667d;
  font-size:12px;
}

.dots{
  display:inline-flex;
  gap:5px;
  align-items:center;
  margin-bottom:7px;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  animation:dotPulse 1.05s ease-in-out infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes dotPulse{
  0%,100%{
    opacity:.2;
    transform:scale(.7);
  }
  50%{
    opacity:1;
    transform:scale(1);
  }
}

/* MOBILE */

@media(max-width:430px){
  body{
    padding:17px 12px 50px;
  }

  .card{
    padding:15px;
  }

  .controls{
    grid-template-columns:1fr;
  }

  textarea{
    min-height:125px;
  }

  .reply-text{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <header class="header">
    <div class="logo-row">
      <div class="logo-icon">💬</div>
      <div class="logo-text">RizzAI</div>
    </div>

    <div class="tagline">
      paste the message. understand the vibe. get the reply.
    </div>
  </header>

  <main>

    <section class="card">

      <label class="lbl" for="msgInput">
        Their message / situation
      </label>

      <textarea
        id="msgInput"
        autocomplete="off"
        spellcheck="true"
        placeholder="paste what they said or tell me the situation...

e.g. she said she's been busy lately
e.g. uska 'wyd' aya
e.g. unknown girl sent 'hey'
e.g. she's taking forever to reply, kya bolu?"
      ></textarea>

      <div class="controls">

        <div class="control">
          <label class="lbl" for="tone">Tone</label>
          <select id="tone">
            <option value="chill">chill</option>
            <option value="flirty">subtle flirty</option>
            <option value="funny">funny</option>
            <option value="cute">cute</option>
            <option value="savage">teasing / savage</option>
            <option value="direct">smooth / direct</option>
          </select>
        </div>

        <div class="control">
          <label class="lbl" for="ctx">Context</label>
          <select id="ctx">
            <option value="unknown">unknown person</option>
            <option value="crush">crush</option>
            <option value="friend">friend</option>
            <option value="early">just started talking</option>
            <option value="ongoing">been talking a while</option>
            <option value="gap">restarting after a gap</option>
            <option value="dry">conversation is dry</option>
            <option value="hinge">hinge / dating app</option>
          </select>
        </div>

      </div>

      <button class="generate" id="genBtn" type="button">
        <span>⚡</span>
        <span id="btnText">Generate</span>
      </button>

      <div class="status" id="status" aria-live="polite"></div>

    </section>

    <section id="results">

      <div class="empty">
        <div class="empty-icon">💬</div>
        paste their message above<br>
        hit generate — 3 replies will show here<br>
        click any reply to copy
      </div>

    </section>

  </main>

</div>

<script>
"use strict";

/*
  RizzAI FRONTEND

  IMPORTANT:
  - No Groq API key lives in this file.
  - The browser talks only to your Vercel backend.
  - Your backend (/api/generate) is responsible for Groq.
*/

const API_ENDPOINT = "/api/generate";

const TONES = {
  chill:
    "chill, effortless, low-pressure, natural",

  flirty:
    "subtle flirty, playful tension, confident but not desperate",

  funny:
    "actually witty and naturally funny, not try-hard",

  cute:
    "warm, genuine, slightly playful, natural",

  savage:
    "light teasing, confident, playful, never mean",

  direct:
    "smooth, direct, confident, conversational, no pickup-line energy"
};

const CONTEXTS = {
  unknown:
    "complete stranger / first contact; do not assume chemistry",

  crush:
    "crush; some familiarity or interest exists",

  friend:
    "friend; comfortable casual conversation",

  early:
    "just started talking; still building familiarity",

  ongoing:
    "they have been talking for a while; existing conversational context",

  gap:
    "restarting conversation after a gap; acknowledge naturally if relevant",

  dry:
    "conversation is becoming dry; revive it without sounding desperate",

  hinge:
    "Hinge or dating app conversation; use profile/message specifics naturally"
};

const $ = id => document.getElementById(id);

const msgInput = $("msgInput");
const toneInput = $("tone");
const ctxInput = $("ctx");
const genBtn = $("genBtn");
const btnText = $("btnText");
const statusBox = $("status");
const results = $("results");

let generating = false;


/* ---------------------------
   BASIC UI HELPERS
---------------------------- */

function setStatus(message = "") {
  statusBox.textContent = message;
}

function setLoading(isLoading) {
  generating = isLoading;
  genBtn.disabled = isLoading;

  if (isLoading) {
    btnText.innerHTML = `
      <span class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
      </span>
      thinking
    `;
  } else {
    btnText.textContent = "Generate";
  }
}

function showLoading() {
  results.innerHTML = `
    <div class="loading">
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div>reading the vibe...</div>
    </div>
  `;
}


/* ---------------------------
   SAFE HTML
---------------------------- */

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ---------------------------
   REPLY NORMALIZATION

   Backend already cleans output,
   but frontend also protects itself
   against accidental formatting.
---------------------------- */

function normalizeReply(value) {
  let text = String(value ?? "").trim();

  text = text
    .replace(/^["'`]+|["'`]+$/g, "")
    .replace(
      /^(?:option|reply|response)\s*\d+\s*[:.)-]\s*/i,
      ""
    )
    .replace(/^\d+\s*[:.)-]\s*/, "")
    .replace(/^[-•*]\s*/, "")
    .trim();

  return text;
}

function normalizeReplies(replies) {
  if (!Array.isArray(replies)) return [];

  const unique = [];

  for (const item of replies) {
    const text = normalizeReply(item);

    if (!text) continue;

    const duplicate = unique.some(
      existing =>
        existing.toLowerCase() === text.toLowerCase()
    );

    if (!duplicate) {
      unique.push(text);
    }
  }

  return unique.slice(0, 3);
}


/* ---------------------------
   RENDER
---------------------------- */

function renderReplies(replies) {
  const safeReplies = normalizeReplies(replies);

  if (safeReplies.length < 3) {
    results.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🫠</div>
        couldn't get three usable replies<br>
        try generating again
      </div>
    `;
    return;
  }

  const labels = [
    ["✦ Best", "best"],
    ["Alt 1", "alt"],
    ["Alt 2", "alt"]
  ];

  results.innerHTML = `
    <div class="results-header">
      <span class="results-title">your replies</span>
      <span class="results-hint">tap to copy</span>
    </div>

    ${safeReplies.map((text, index) => `
      <article class="reply ${index === 0 ? "best" : ""}" data-index="${index}">

        <div class="reply-top">
          <span class="badge ${labels[index][1]}">
            ${labels[index][0]}
          </span>

          <button
            class="copy"
            type="button"
            data-copy="${escapeHTML(text)}"
          >
            Copy
          </button>
        </div>

        <div class="reply-text">
          ${escapeHTML(text)}
        </div>

      </article>
    `).join("")}
  `;

  /*
    Event listeners are attached after rendering.
    This avoids inline onclick handlers and quote-breaking
    when a generated reply contains apostrophes.
  */

  document.querySelectorAll(".reply").forEach(card => {
    card.addEventListener("click", async event => {

      if (event.target.closest(".copy")) return;

      await copyReply(
        card.querySelector(".reply-text").textContent,
        card
      );
    });
  });

  document.querySelectorAll(".copy").forEach(button => {
    button.addEventListener("click", async event => {
      event.stopPropagation();

      const card = button.closest(".reply");
      const text = card.querySelector(".reply-text").textContent;

      await copyReply(text, card);
    });
  });
}


/* ---------------------------
   COPY
---------------------------- */

async function copyReply(text, card) {
  try {

    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const area = document.createElement("textarea");

      area.value = text;
      area.style.position = "fixed";
      area.style.opacity = "0";

      document.body.appendChild(area);
      area.focus();
      area.select();

      document.execCommand("copy");
      area.remove();
    }

    const copyButton = card.querySelector(".copy");

    if (copyButton) {
      const original = copyButton.textContent;

      copyButton.textContent = "✓ Copied";

      setTimeout(() => {
        copyButton.textContent = original;
      }, 1400);
    }

    card.style.borderColor = "rgba(16,185,129,.65)";

    setTimeout(() => {
      card.style.borderColor = "";
    }, 1400);

  } catch (error) {
    console.error("Copy failed:", error);
  }
}


/* ---------------------------
   RESPONSE ERROR HANDLING

   Converts backend errors into
   useful user-facing messages.
---------------------------- */

async function readServerResponse(response) {

  const contentType =
    response.headers.get("content-type") || "";

  if (contentType.includes("application/json")) {

    try {
      return await response.json();
    } catch {
      return {};
    }
  }

  const text = await response.text();

  return {
    error: text || "Server returned an invalid response."
  };
}


/* ---------------------------
   GENERATE
---------------------------- */

async function generate() {

  if (generating) return;

  const msg = msgInput.value.trim();

  if (!msg) {
    setStatus("paste their message first");
    msgInput.focus();
    return;
  }

  if (msg.length > 12000) {
    setStatus("that's a lot 😭 keep the chat under 12,000 characters");
    return;
  }

  setStatus("");
  setLoading(true);
  showLoading();

  const toneKey = toneInput.value;
  const ctxKey = ctxInput.value;

  const payload = {
    msg,
    tone: TONES[toneKey] || TONES.chill,
    ctx: CONTEXTS[ctxKey] || CONTEXTS.unknown
  };

  try {

    const response = await fetch(API_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const data = await readServerResponse(response);

    if (!response.ok) {

      console.error("RizzAI backend error:", {
        status: response.status,
        data
      });

      /*
        Keep provider/server details out of the UI.
        Those details remain in Vercel logs.
      */

      if (response.status === 429) {
        throw new Error(
          "AI is busy right now — give it a second and retry."
        );
      }

      if (response.status >= 500) {
        throw new Error(
          "RizzAI couldn't generate a reply right now. Try again."
        );
      }

      throw new Error(
        data?.error || "Something went wrong. Try again."
      );
    }

    const replies = normalizeReplies(data?.replies);

    if (replies.length !== 3) {
      console.error("Invalid RizzAI response:", data);

      throw new Error(
        "RizzAI returned an incomplete response. Try again."
      );
    }

    renderReplies(replies);

  } catch (error) {

    console.error("Generate error:", error);

    results.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🫠</div>
        couldn't generate right now<br>
        check your connection and try again
      </div>
    `;

    setStatus(
      error?.message ||
      "RizzAI couldn't generate a reply right now."
    );

  } finally {

    setLoading(false);
  }
}


/* ---------------------------
   EVENTS
---------------------------- */

genBtn.addEventListener("click", generate);

msgInput.addEventListener("keydown", event => {

  /*
    Ctrl + Enter / Cmd + Enter = generate
    Normal Enter remains normal textarea behavior.
  */

  if (
    event.key === "Enter" &&
    (event.ctrlKey || event.metaKey)
  ) {
    event.preventDefault();
    generate();
  }
});


/*
  Clear stale error when the user starts typing.
*/

msgInput.addEventListener("input", () => {
  if (statusBox.textContent) {
    setStatus("");
  }
});


/*
  Prevent accidental double submission while
  browser is waiting for the backend.
*/

window.addEventListener("beforeunload", event => {
  if (!generating) return;

  /*
    We intentionally do not block navigation.
    This simply exists as a safe state hook.
  */
});


/* ---------------------------
   OPTIONAL HEALTH CHECK

   No API request is made here.
   The backend is contacted only when
   the user actually presses Generate.
---------------------------- */

console.log("RizzAI frontend ready.");
</script>

</body>
</html>
