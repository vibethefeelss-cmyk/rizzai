<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<meta
  name="theme-color"
  content="#090910"
/>

<meta
  name="description"
  content="RizzAI — natural replies for real conversations"
/>

<title>RizzAI</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
/>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
/>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#090910;
  --card:#11111b;
  --input:#181824;
  --border:#29293d;
  --border-hover:#454565;
  --text:#f3f1ff;
  --muted:#85859d;
  --dim:#505067;
  --purple:#7c3aed;
  --purple2:#6d28d9;
  --danger:#ef4444;
  --success:#10b981;
}

html{
  min-height:100%;
}

body{
  margin:0;
  min-height:100vh;

  font-family:'Inter',sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(124,58,237,.14),
      transparent 35%
    ),
    var(--bg);

  color:var(--text);

  padding:
    22px
    16px
    70px;

  -webkit-font-smoothing:antialiased;
}

button,
textarea,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.wrap{
  width:100%;
  max-width:540px;
  margin:0 auto;
}

/* HEADER */

.header{
  text-align:center;
  padding:
    12px
    0
    24px;
}

.logo-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:7px;
}

.logo-icon{
  width:36px;
  height:36px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #ec4899
    );

  box-shadow:
    0 8px 30px
    rgba(124,58,237,.23);

  font-size:17px;
}

.logo-text{
  font-size:22px;
  font-weight:700;
  letter-spacing:-.03em;

  background:
    linear-gradient(
      90deg,
      #fff,
      #b78aff
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.tagline{
  color:var(--muted);
  font-size:12px;
}

/* CARD */

.card{
  background:
    rgba(17,17,27,.95);

  border:
    1px solid
    var(--border);

  border-radius:18px;

  padding:18px;

  margin-bottom:14px;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.18);
}

.lbl{
  display:block;

  margin-bottom:9px;

  color:#66667d;

  font-size:10px;
  font-weight:700;

  letter-spacing:.09em;
  text-transform:uppercase;
}

textarea{
  display:block;

  width:100%;

  min-height:120px;

  resize:vertical;

  background:
    var(--input);

  border:
    1px solid
    var(--border);

  border-radius:12px;

  outline:none;

  color:var(--text);

  padding:
    13px
    14px;

  font-size:14px;

  line-height:1.6;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

textarea:focus{
  border-color:
    rgba(124,58,237,.8);

  box-shadow:
    0 0 0 3px
    rgba(124,58,237,.08);
}

textarea::placeholder{
  color:#4b4b62;
}

/* CONTROLS */

.controls{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:9px;

  margin-top:10px;
}

select{
  width:100%;

  background:
    var(--input);

  border:
    1px solid
    var(--border);

  color:var(--text);

  padding:
    10px
    11px;

  border-radius:10px;

  outline:none;

  font-size:12px;

  cursor:pointer;
}

select:focus{
  border-color:
    var(--purple);
}

/* GENERATE */

.generate{
  width:100%;

  min-height:46px;

  margin-top:11px;

  border:0;

  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--purple2)
    );

  color:#fff;

  font-size:14px;
  font-weight:600;

  cursor:pointer;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:8px;

  box-shadow:
    0 8px 25px
    rgba(124,58,237,.18);

  transition:
    transform .15s ease,
    filter .15s ease,
    opacity .15s ease;
}

.generate:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
}

.generate:active{
  transform:translateY(0);
}

.generate:disabled{
  opacity:.58;
  cursor:not-allowed;
  transform:none;
}

/* STATUS */

.status{
  min-height:18px;

  margin-top:8px;

  text-align:center;

  color:var(--danger);

  font-size:12px;

  line-height:1.4;
}

/* RESULTS */

.results-header{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin:
    5px
    2px
    9px;
}

.results-title{
  color:#73738c;

  font-size:10px;

  font-weight:700;

  letter-spacing:.09em;

  text-transform:uppercase;
}

.results-hint{
  color:#4e4e64;

  font-size:10px;
}

.reply{
  background:
    rgba(17,17,27,.95);

  border:
    1px solid
    var(--border);

  border-radius:13px;

  padding:
    14px
    15px;

  margin-bottom:9px;

  transition:
    border-color .18s ease,
    transform .18s ease,
    background .18s ease;

  cursor:pointer;
}

.reply:hover{
  border-color:
    var(--border-hover);

  transform:
    translateY(-1px);
}

.reply.best{
  border-color:
    rgba(124,58,237,.48);

  background:
    linear-gradient(
      120deg,
      rgba(124,58,237,.08),
      rgba(17,17,27,.96)
    );
}

.reply-top{
  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:9px;
}

.badge{
  display:inline-flex;

  align-items:center;

  border-radius:20px;

  padding:
    3px
    8px;

  font-size:9px;

  font-weight:700;

  letter-spacing:.06em;

  text-transform:uppercase;
}

.badge.best{
  color:#b58cff;

  background:
    rgba(124,58,237,.16);
}

.badge.alt{
  color:#74748c;

  background:
    rgba(255,255,255,.045);
}

.copy{
  border:0;

  background:transparent;

  color:#77778e;

  cursor:pointer;

  padding:
    3px
    0
    3px
    10px;

  font-size:11px;
}

.copy:hover{
  color:#b0aec5;
}

.reply-text{
  color:#f0eef9;

  font-size:15px;

  line-height:1.55;

  font-weight:500;

  word-break:break-word;
}

/* EMPTY */

.empty{
  border:
    1px dashed
    #242438;

  border-radius:14px;

  padding:
    38px
    18px;

  text-align:center;

  color:#4b4b62;

  font-size:12px;

  line-height:1.8;
}

.empty-icon{
  font-size:22px;

  opacity:.65;

  margin-bottom:7px;
}

/* LOADING */

.loading{
  border:
    1px solid
    var(--border);

  border-radius:13px;

  padding:22px;

  text-align:center;

  color:#66667d;

  font-size:12px;
}

.dots{
  display:inline-flex;

  gap:5px;

  align-items:center;

  margin-bottom:7px;
}

.dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#fff;

  animation:
    pulse 1.05s
    ease-in-out
    infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes pulse{

  0%,100%{
    opacity:.2;
    transform:scale(.7);
  }

  50%{
    opacity:1;
    transform:scale(1);
  }
}

/* MOBILE */

@media(max-width:430px){

  body{
    padding:
      17px
      12px
      50px;
  }

  .card{
    padding:15px;
  }

  .controls{
    grid-template-columns:1fr;
  }

  textarea{
    min-height:125px;
  }

  .reply-text{
    font-size:14px;
  }
}

</style>

</head>

<body>

<div class="wrap">

  <header class="header">

    <div class="logo-row">

      <div class="logo-icon">
        💬
      </div>

      <div class="logo-text">
        RizzAI
      </div>

    </div>

    <div class="tagline">
      paste the message. understand the vibe. get the reply.
    </div>

  </header>


  <main>

    <section class="card">

      <label
        class="lbl"
        for="msgInput"
      >
        Their message / situation
      </label>


      <textarea
        id="msgInput"
        autocomplete="off"
        spellcheck="true"
        placeholder="paste what they said or tell me the situation...

e.g. she said she's been busy lately
e.g. uska 'wyd' aya
e.g. unknown girl sent 'hey'
e.g. she's taking forever to reply, kya bolu?"
      ></textarea>


      <div class="controls">

        <div>

          <label
            class="lbl"
            for="tone"
          >
            Tone
          </label>

          <select id="tone">

            <option value="chill">
              chill
            </option>

            <option value="flirty">
              subtle flirty
            </option>

            <option value="funny">
              funny
            </option>

            <option value="cute">
              cute
            </option>

            <option value="savage">
              teasing / savage
            </option>

            <option value="direct">
              smooth / direct
            </option>

          </select>

        </div>


        <div>

          <label
            class="lbl"
            for="ctx"
          >
            Context
          </label>

          <select id="ctx">

            <option value="unknown">
              unknown person
            </option>

            <option value="crush">
              crush
            </option>

            <option value="friend">
              friend
            </option>

            <option value="early">
              just started talking
            </option>

            <option value="ongoing">
              been talking a while
            </option>

            <option value="gap">
              restarting after a gap
            </option>

            <option value="dry">
              conversation is dry
            </option>

            <option value="hinge">
              hinge / dating app
            </option>

          </select>

        </div>

      </div>


      <button
        class="generate"
        id="genBtn"
        type="button"
      >

        <span>
          ⚡
        </span>

        <span id="btnText">
          Generate
        </span>

      </button>


      <div
        class="status"
        id="status"
        aria-live="polite"
      ></div>

    </section>


    <section id="results">

      <div class="empty">

        <div class="empty-icon">
          💬
        </div>

        paste their message above<br>

        hit generate — 3 replies will show here<br>

        click any reply to copy

      </div>

    </section>

  </main>

</div>


<script>

"use strict";


/* =========================================================
   CONFIG
========================================================= */

const API_ENDPOINT =
  "/api/generate";


/* =========================================================
   UI DATA
========================================================= */

const TONES = {

  chill:
    "chill, effortless, low-pressure, natural",

  flirty:
    "subtle flirty, playful tension, confident but not desperate",

  funny:
    "actually witty and naturally funny, not try-hard",

  cute:
    "warm, genuine, slightly playful, natural",

  savage:
    "light teasing, confident, playful, never mean",

  direct:
    "smooth, direct, confident, conversational, no pickup-line energy"

};


const CONTEXTS = {

  unknown:
    "complete stranger / first contact; do not assume chemistry",

  crush:
    "crush; some familiarity or interest exists",

  friend:
    "friend; comfortable casual conversation",

  early:
    "just started talking; still building familiarity",

  ongoing:
    "they have been talking for a while; existing conversational context",

  gap:
    "restarting conversation after a gap; acknowledge naturally if relevant",

  dry:
    "conversation is becoming dry; revive it without sounding desperate",

  hinge:
    "Hinge or dating app conversation; use profile/message specifics naturally"

};


/* =========================================================
   DOM
========================================================= */

const msgInput =
  document.getElementById("msgInput");

const toneInput =
  document.getElementById("tone");

const ctxInput =
  document.getElementById("ctx");

const genBtn =
  document.getElementById("genBtn");

const btnText =
  document.getElementById("btnText");

const statusBox =
  document.getElementById("status");

const results =
  document.getElementById("results");


/* =========================================================
   SESSION MEMORY

   This is intentionally local to the browser.

   It lets:

   first generation:
      "she said she's busy"

   followed by:
      "or do"

   reuse the SAME context while rejecting
   previous replies.
========================================================= */

let session = {

  lastInput: "",

  lastTone: "chill",

  lastContext: "unknown",

  lastReplies: [],

  generationCount: 0

};


let generating = false;


/* =========================================================
   "OR DO" DETECTION
========================================================= */

function isMoreRequest(text) {

  const normalized =
    String(text || "")
      .trim()
      .toLowerCase()
      .replace(/[.!?]+$/g, "");

  const patterns = [

    "or do",
    "aur do",
    "more",
    "more please",
    "another",
    "another one",
    "aur",
    "aur batao",
    "aur accha",
    "aur accha do",
    "better",
    "better one",
    "do aur",
    "ek aur",
    "ek aur do",
    "more options",
    "different",
    "different ones"

  ];

  return patterns.includes(normalized);
}


function isBetterRequest(text) {

  const normalized =
    String(text || "")
      .trim()
      .toLowerCase();

  return (

    normalized.includes("accha nahi laga") ||

    normalized.includes("acha nahi laga") ||

    normalized.includes("pasand nahi") ||

    normalized.includes("better reply") ||

    normalized.includes("aur better") ||

    normalized.includes("yeh nahi") ||

    normalized.includes("not good")

  );
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(message = "") {

  statusBox.textContent =
    message;

}


/* =========================================================
   LOADING
========================================================= */

function setLoading(isLoading) {

  generating =
    isLoading;

  genBtn.disabled =
    isLoading;


  if (isLoading) {

    btnText.innerHTML = `
      <span class="dots">

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

      </span>

      thinking
    `;

  } else {

    btnText.textContent =
      "Generate";

  }

}


/* =========================================================
   LOADING SCREEN
========================================================= */

function showLoading() {

  results.innerHTML = `

    <div class="loading">

      <div class="dots">

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

      </div>

      <div>
        reading the vibe...
      </div>

    </div>

  `;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeReply(value) {

  return String(value ?? "")
    .replace(/\r?\n/g, " ")
    .replace(/\s+/g, " ")
    .replace(/^["'`]+|["'`]+$/g, "")
    .replace(
      /^(?:option|reply|response)\s*\d+\s*[:.)-]\s*/i,
      ""
    )
    .replace(
      /^\d+\s*[:.)-]\s*/,
      ""
    )
    .replace(
      /^[-•*]\s*/,
      ""
    )
    .trim();

}


function normalizeReplies(replies) {

  if (!Array.isArray(replies)) {
    return [];
  }

  const output = [];

  for (const item of replies) {

    const text =
      normalizeReply(item);

    if (!text) continue;

    const exists =
      output.some(
        existing =>
          existing.toLowerCase() ===
          text.toLowerCase()
      );

    if (!exists) {
      output.push(text);
    }

  }

  return output.slice(0,3);

}


/* =========================================================
   RENDER
========================================================= */

function renderReplies(replies) {

  const clean =
    normalizeReplies(replies);


  if (clean.length !== 3) {

    results.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🫠
        </div>

        couldn't get three usable replies<br>
        try again

      </div>

    `;

    return;

  }


  const labels = [

    ["✦ Best","best"],

    ["Alt 1","alt"],

    ["Alt 2","alt"]

  ];


  results.innerHTML = `

    <div class="results-header">

      <span class="results-title">
        your replies
      </span>

      <span class="results-hint">
        tap to copy
      </span>

    </div>


    ${clean.map((text,index)=>`

      <article
        class="reply ${index === 0 ? "best" : ""}"
      >

        <div class="reply-top">

          <span
            class="badge ${labels[index][1]}"
          >
            ${labels[index][0]}
          </span>


          <button
            class="copy"
            type="button"
          >
            Copy
          </button>

        </div>


        <div class="reply-text">
          ${escapeHTML(text)}
        </div>

      </article>

    `).join("")}

  `;


  const cards =
    document.querySelectorAll(".reply");


  cards.forEach(card => {

    card.addEventListener(
      "click",
      async event => {

        if (
          event.target.closest(".copy")
        ) {
          return;
        }

        const text =
          card.querySelector(
            ".reply-text"
          ).textContent;

        await copyReply(
          text,
          card
        );

      }
    );

  });


  document
    .querySelectorAll(".copy")
    .forEach(button => {

      button.addEventListener(
        "click",
        async event => {

          event.stopPropagation();

          const card =
            button.closest(".reply");

          const text =
            card.querySelector(
              ".reply-text"
            ).textContent;

          await copyReply(
            text,
            card
          );

        }
      );

    });

}


/* =========================================================
   COPY
========================================================= */

async function copyReply(
  text,
  card
) {

  try {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator.clipboard
        .writeText(text);

    } else {

      const area =
        document.createElement("textarea");

      area.value =
        text;

      area.style.position =
        "fixed";

      area.style.opacity =
        "0";

      document.body.appendChild(area);

      area.focus();
      area.select();

      document.execCommand("copy");

      area.remove();

    }


    const button =
      card.querySelector(".copy");


    if (button) {

      button.textContent =
        "✓ Copied";

      setTimeout(() => {

        button.textContent =
          "Copy";

      },1400);

    }


    card.style.borderColor =
      "rgba(16,185,129,.65)";


    setTimeout(() => {

      card.style.borderColor =
        "";

    },1400);


  } catch(error) {

    console.error(
      "Copy failed:",
      error
    );

  }

}


/* =========================================================
   SERVER RESPONSE
========================================================= */

async function readResponse(
  response
) {

  const type =
    response.headers.get(
      "content-type"
    ) || "";


  if (
    type.includes(
      "application/json"
    )
  ) {

    try {

      return await response.json();

    } catch {

      return {};

    }

  }


  const text =
    await response.text();


  return {
    error:
      text ||
      "Invalid server response"
  };

}


/* =========================================================
   GENERATE
========================================================= */

async function generate() {

  if (generating) {
    return;
  }


  const typedInput =
    msgInput.value.trim();


  if (!typedInput) {

    setStatus(
      "paste their message first"
    );

    msgInput.focus();

    return;

  }


  /*
    Detect continuation commands.

    "or do"
    "aur do"
    "better"
    etc.

    They reuse the previous conversation.
  */

  const moreRequest =
    isMoreRequest(
      typedInput
    );

  const betterRequest =
    isBetterRequest(
      typedInput
    );


  let actualMessage =
    typedInput;


  let generationMode =
    "new";


  if (
    (moreRequest || betterRequest) &&
    session.lastInput
  ) {

    actualMessage =
      session.lastInput;

    generationMode =
      moreRequest
        ? "more"
        : "better";

  }


  /*
    If user simply types "or do" before
    any generation, treat it normally instead
    of sending an empty context.
  */

  if (
    (moreRequest || betterRequest) &&
    !session.lastInput
  ) {

    actualMessage =
      typedInput;

    generationMode =
      "new";

  }


  if (
    actualMessage.length >
    12000
  ) {

    setStatus(
      "that's a lot 😭 keep it under 12,000 characters"
    );

    return;

  }


  setStatus("");

  setLoading(true);

  showLoading();


  const toneKey =
    moreRequest || betterRequest
      ? session.lastTone
      : toneInput.value;


  const ctxKey =
    moreRequest || betterRequest
      ? session.lastContext
      : ctxInput.value;


  const payload = {

    msg:
      actualMessage,

    tone:
      TONES[toneKey] ||
      TONES.chill,

    ctx:
      CONTEXTS[ctxKey] ||
      CONTEXTS.unknown,

    generationMode,

    previousReplies:
      session.lastReplies.slice(0,3)

  };


  try {

    const response =
      await fetch(
        API_ENDPOINT,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body:
            JSON.stringify(payload)
        }
      );


    const data =
      await readResponse(
        response
      );


    if (!response.ok) {

      console.error(
        "RizzAI backend error:",
        {
          status:
            response.status,

          data
        }
      );


      if (
        response.status === 429
      ) {

        throw new Error(
          "AI is busy right now — try again in a moment."
        );

      }


      if (
        response.status >= 500
      ) {

        throw new Error(
          "RizzAI couldn't generate right now. Try again."
        );

      }


      throw new Error(
        data?.error ||
        "Something went wrong. Try again."
      );

    }


    const replies =
      normalizeReplies(
        data?.replies
      );


    if (
      replies.length !== 3
    ) {

      console.error(
        "Invalid RizzAI response:",
        data
      );

      throw new Error(
        "RizzAI returned an incomplete response. Try again."
      );

    }


    /*
      Save the context for:

      "or do"
      "aur do"
      "better"
      etc.
    */

    session.lastInput =
      actualMessage;

    session.lastTone =
      toneKey;

    session.lastContext =
      ctxKey;

    session.lastReplies =
      replies;

    session.generationCount++;


    renderReplies(
      replies
    );


    /*
      If the user clicked Generate again
      with the same input, the next request
      naturally knows the previous replies.
    */

    if (
      moreRequest ||
      betterRequest
    ) {

      msgInput.value =
        typedInput;

    }


  } catch(error) {

    console.error(
      "Generate error:",
      error
    );


    results.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🫠
        </div>

        couldn't generate right now<br>
        try again in a moment

      </div>

    `;


    setStatus(
      error?.message ||
      "RizzAI couldn't generate right now."
    );


  } finally {

    setLoading(false);

  }

}


/* =========================================================
   BUTTON
========================================================= */

genBtn.addEventListener(
  "click",
  generate
);


/* =========================================================
   CTRL/CMD + ENTER
========================================================= */

msgInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      (event.ctrlKey ||
       event.metaKey)
    ) {

      event.preventDefault();

      generate();

    }

  }
);


/* =========================================================
   CLEAR ERROR WHILE TYPING
========================================================= */

msgInput.addEventListener(
  "input",
  () => {

    if (
      statusBox.textContent
    ) {

      setStatus("");

    }

  }
);


console.log(
  "RizzAI ready."
);

</script>

</body>
</html>
