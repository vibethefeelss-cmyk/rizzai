<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizzAI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#0A0A14;color:#F0EFFF;min-height:100vh;display:flex;justify-content:center;padding:24px 16px 60px;}
.wrap{width:100%;max-width:500px;}
.header{text-align:center;margin-bottom:24px;padding-top:12px;}
.logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;}
.logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#7C3AED,#F472B6);display:flex;align-items:center;justify-content:center;font-size:17px;}
.logo-text{font-size:21px;font-weight:700;background:linear-gradient(90deg,#fff 30%,#9D5EFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.tagline{font-size:13px;color:#8888AA;}
.card{background:#12121F;border:1px solid #2A2A45;border-radius:16px;padding:18px;margin-bottom:14px;}
.lbl{font-size:10px;font-weight:700;color:#44445A;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;display:block;}
textarea{width:100%;background:#1A1A2E;border:1px solid #2A2A45;border-radius:10px;padding:12px 13px;color:#F0EFFF;font-size:14px;font-family:inherit;resize:none;outline:none;min-height:95px;line-height:1.6;transition:border-color .2s;}
textarea:focus{border-color:#7C3AED;}
textarea::placeholder{color:#44445A;}
.row{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap;}
select{flex:1;min-width:130px;background:#1A1A2E;border:1px solid #2A2A45;color:#F0EFFF;padding:8px 11px;border-radius:9px;font-size:13px;font-family:inherit;outline:none;cursor:pointer;}
select:focus{border-color:#7C3AED;}
.btn{width:100%;background:#7C3AED;border:none;color:#fff;padding:12px;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer;margin-top:11px;display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;transition:background .2s;}
.btn:hover{background:#6D28D9;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.err{color:#EF4444;font-size:12px;margin-top:7px;text-align:center;}
.reply{background:#12121F;border:1px solid #2A2A45;border-radius:12px;padding:13px 15px;margin-bottom:9px;cursor:pointer;transition:border-color .18s,transform .18s;}
.reply:hover{border-color:#7C3AED;transform:translateX(2px);}
.reply.best{border-color:rgba(124,58,237,.45);background:rgba(124,58,237,.06);}
.reply-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.badge{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:20px;}
.badge.b{background:rgba(124,58,237,.2);color:#9D5EFF;}
.badge.a{background:rgba(255,255,255,.06);color:#8888AA;}
.cpbtn{background:none;border:none;color:#8888AA;cursor:pointer;font-size:12px;padding:2px 8px;border-radius:5px;font-family:inherit;}
.reply-text{font-size:15px;line-height:1.55;font-weight:500;}
.empty{text-align:center;padding:36px 16px;color:#44445A;font-size:13px;line-height:1.8;}
.dots{display:inline-flex;gap:5px;align-items:center;}
.dot{width:6px;height:6px;border-radius:50%;background:#fff;display:inline-block;animation:p 1.1s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:.15s;}.dot:nth-child(3){animation-delay:.3s;}
@keyframes p{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo-row">
      <div class="logo-icon">💬</div>
      <span class="logo-text">RizzAI</span>
    </div>
    <div class="tagline">paste the message. get the reply. send it.</div>
  </div>

  <div class="card">
    <span class="lbl">Their message / situation</span>
    <textarea id="msgInput" rows="4" placeholder="Paste their message or describe the situation...&#10;&#10;e.g. &quot;unknown ladki ka hey aya hai&quot;&#10;e.g. &quot;she said haha okay, baat dry ho rahi hai&quot;&#10;e.g. &quot;hinge prompt: key to my heart is maggie and tea&quot;"></textarea>
    <div class="row">
      <select id="tone">
        <option value="chill">😌 Chill</option>
        <option value="flirty">✨ Flirty</option>
        <option value="funny">😭 Funny</option>
        <option value="cute">🤍 Cute</option>
        <option value="savage">🫠 Savage</option>
      </select>
      <select id="ctx">
        <option value="unknown">Unknown person</option>
        <option value="crush">Crush</option>
        <option value="friend">Friend</option>
        <option value="early">Just started talking</option>
        <option value="ongoing">Been talking a while</option>
        <option value="gap">Gap restart</option>
        <option value="dry">Dry conversation</option>
        <option value="hinge">Hinge / Dating app</option>
      </select>
    </div>
    <button class="btn" id="genBtn" onclick="generate()">⚡ Generate</button>
    <div class="err" id="err"></div>
  </div>

  <div id="results">
    <div class="empty">💬<br><br>paste their message above<br>hit generate — 3 options aayenge<br>click any to copy</div>
  </div>
</div>

<script>
const TONES={chill:"chill, low effort, unbothered",flirty:"subtle flirty, light tension, playful, not desperate",funny:"actually funny and witty",cute:"warm, genuine, slightly playful",savage:"confident, slightly teasing, zero neediness"};
const CTXS={unknown:"complete stranger, first contact, do NOT assume chemistry",crush:"crush, some familiarity exists",friend:"friend, casual and comfortable",early:"just started talking 1-2 times",ongoing:"been talking for a while",gap:"reconnecting after a gap, acknowledge lightly",dry:"conversation going dry, rescue mode",hinge:"hinge or dating app, comment on their prompt naturally"};

async function generate(){
  const msg=document.getElementById('msgInput').value.trim();
  if(!msg){showErr('Kuch toh type karo');return;}
  showErr('');
  const btn=document.getElementById('genBtn');
  btn.disabled=true;
  btn.innerHTML='<span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';
  document.getElementById('results').innerHTML='';

  const tone=document.getElementById('tone').value;
  const ctx=document.getElementById('ctx').value;

  try{
    const res=await fetch('/api/generate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({msg,tone:TONES[tone],ctx:CTXS[ctx]})
    });
    const data=await res.json();
    if(!res.ok)throw new Error(data?.error||'Error aaya');
    if(!data.replies?.length)throw new Error('Retry karo');
    renderReplies(data.replies);
  }catch(e){showErr(e.message||'Error — retry karo');}

  btn.disabled=false;
  btn.innerHTML='⚡ Generate';
}

function renderReplies(lines){
  const labels=['✦ Best','Alt 1','Alt 2'];
  document.getElementById('results').innerHTML=lines.map((text,i)=>`
    <div class="reply${i===0?' best':''}" onclick="copyText(this,'${esc(text)}')">
      <div class="reply-top">
        <span class="badge ${i===0?'b':'a'}">${labels[i]}</span>
        <button class="cpbtn" onclick="event.stopPropagation();copyText(this.closest('.reply'),'${esc(text)}')">Copy</button>
      </div>
      <div class="reply-text">${escHtml(text)}</div>
    </div>`).join('');
}

function copyText(card,text){
  navigator.clipboard.writeText(text.replace(/&#39;/g,"'")).then(()=>{
    const btn=card.querySelector('.cpbtn');
    if(btn){btn.textContent='✓ Copied';setTimeout(()=>btn.textContent='Copy',1400);}
    card.style.borderColor='#10B981';
    setTimeout(()=>card.style.borderColor='',1400);
  });
}

function showErr(msg){document.getElementById('err').textContent=msg;}
function esc(s){return String(s).replace(/'/g,"&#39;");}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey)generate();});
</script>
</body>
</html>
